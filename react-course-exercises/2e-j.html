<!DOCTYPE html>
<html>
  <head>
    <title>2e-j</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function ProductDetails( {name, price, discountPrice, imgSrc} ){
        return (
          <div>
            <img src={imgSrc} width="50"/>
            <p> {name} </p>
            {!discountPrice ? (
              <p> Price: {price} dollarydoos </p> 
            ) : (
              <>
              <del> Price: {price} dollarydoos </del> 
              <p> Discount Price: {discountPrice} dollarydoos </p>
              </> 
            )}
            <button> Add to Cart </button>
          </div>
        );
      }

      function ProductList(){
        return (
          <div>
            <ProductDetails name="Cotton Socks" price="10.90" discountPrice="5.3" imgSrc="https://supersimple.dev/images/cotton-socks.png"/>
            <ProductDetails name="Tennis balls" price="6.00" imgSrc="https://supersimple.dev/images/tennis-balls.png"/>
            <ProductDetails name="Plain T-Shirt" price="7.99" imgSrc="https://supersimple.dev/images/plain-t-shirt.png"/>
          </div>
        );
      }

      function App(){
        return (
          <ProductList />
        );
      }


      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container)
      root.render(<App/>);
    </script>
  </body>
</html>
