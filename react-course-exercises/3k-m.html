<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 4</title>
    <style>
      body {
        font-family: Arial;
        margin-top: 0px;
        margin-bottom: 0px;
      }
    
      .chat-profile {
        width: 45px;
      }
    
      .chatbot-msg {
        display: flex;
        justify-content: start;
        align-items: start;
      }
    
      .user-msg {
        display: flex;
        justify-content: end;
        align-items: start;
      }
    
      .msg-text {
        background-color: rgb(238, 238, 238);
        padding: 15px 20px;
        border-radius: 10px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
        max-width: 300px;
      }
    
      .chat-messages {
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
      }
    
      .chat-input-container {
        display: flex; 
        margin-bottom: 60px;
      }
    
      .app-container {
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
    
      .send-button {
        background-color: rgb(25, 135, 84);
        color: white;
        font-size: 15px;
        padding: 12px 20px;
        margin-left: 10px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
    
      .chat-input {
        padding: 12px 15px;
        border-radius: 10px;
        border-width: 1px;
        font-size: 15px;
        flex-grow: 1;
      }
      
      .welcome-msg {
        text-align: center;
        color: gray;
      }
     
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function ChatInput({ chatMessages, setChatMessages, isLoading, setIsLoading }){
        const [ inputText, setInputText ] = React.useState('');
        
        function saveInputText(event){
          setInputText(event.target.value);
        }

        async function sendMessage(){
          if ( isLoading || inputText === ''){
            return;
          }
          
          const newChatMessages = [
            ...chatMessages,
            {
              message: inputText,
              sender:'user',
              id: crypto.randomUUID()
            }
          ]
          setChatMessages(newChatMessages)
          setInputText('');
          
          setIsLoading(true);
          const response = await Chatbot.getResponseAsync(inputText);
          setChatMessages([
            ...newChatMessages,
            {
              message: response,
              sender:'chatbot',
              id: crypto.randomUUID()
            }
          ])
          setIsLoading(false);
        }
        
        function keyPress(event){
          // console.log(event.key);
          if (event.key === 'Enter'){
            sendMessage();
          } else if (event.key === 'Escape' || event.key === 'Backspace'){
            setInputText('');
          }
          // The " || event.key === 'Backspace' " clause is to provide 
          // a mobile device alternative to an Esc key. Remove ass needed.
        }

        return (
          <div
            className="chat-input-container"
          >
            <input 
              placeholder="Send a message to the chatbot" 
              size="30"
              value={inputText}
              onChange={saveInputText}
              onKeyDown={keyPress}
              className="chat-input"
            />
            <button 
              onClick={sendMessage}
              className="send-button"
            > Send </button>
          </div>
        );
      }

      function ChatMessage({ message, sender }){
        return (
          <div
            className={
              sender === 'chatbot' 
              ? 'chatbot-msg'
              : 'user-msg'}
          >
            {sender === "chatbot" && (
              <img src="robot.png"
                className="chat-profile"
              />
            )}
            
            <div
              className="msg-text"
            >
            {message}
            </div>
            {sender === "user" && (
              <img src="user.png"
                className="chat-profile"
              />
            )}
          </div>
          );
      }

      function ChatMessages({ chatMessages, isLoading }){
        const chatMessagesRef = React.useRef(null);
        
        React.useEffect(() => {
          const containerElem = chatMessagesRef.current;
          if (containerElem) {
            containerElem.scrollTop = containerElem.scrollHeight;
          }
        }, [chatMessages]);
      
      // Below is another way to store the first and second values given by useState into a variable;
      // 0 being the current array and 1 being a function that updates the array AND the HTML
      // const [ chatMessages, setChatMessages ] = array;

      // Above is a shortcut for the 2 lines of code below
      // const chatMessages = array[0];
      // const setChatMessages = array[1];

        return (
          <div
            className="chat-messages"
            ref={chatMessagesRef}
          > 
          {chatMessages.length !== 0 ?            
          (chatMessages.map((chatMessage) => {
            return (
              <ChatMessage 
                message={chatMessage.message}
                sender={chatMessage.sender}
                key={chatMessage.id}
              />
              );
              })
            ) : (
              <div
                className="welcome-msg"
              > Welcome to the chatbot project! Send a message using the textbox below.
              </div>
              )}
            
              {isLoading && (
              <ChatMessage 
                message="Loading...."
                sender="chatbot"
              />                
               )}
            </div>
          );
      }

      function App(){
        const [ chatMessages, setChatMessages ] = React.useState([]);
        const [ isLoading, setIsLoading ] = React.useState(false);

        return (
          <div
            className="app-container"
          > 
          <ChatMessages 
            chatMessages={chatMessages}
            isLoading={isLoading}
          />
          <ChatInput
            chatMessages={chatMessages}
            setChatMessages={setChatMessages}
            isLoading={isLoading}
            setIsLoading={setIsLoading}
          />      
          </div>
        );
      } 

      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container)
      root.render(<App/>);
        
    </script>
  </body>
</html>
