<!DOCTYPE html>
<html>
  <head>
    <title>4h-i</title>
    <style>
      body {
        margin-top: 0px;
        margin-bottom: 0px;
        font-family: Arial;
      }
    
      .buttons {
        display: flex;
        justify-content: center;    
        background-color: rgb(222, 222, 222);
        height: 100vh;
        align-items: center;
      }
    
      .button {
        background-color: rgb(25, 135, 84);
        border: none;
        border-radius: 5px;
        color: white;
        margin-left: 5px;
        margin-right: 5px;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
    
      function ClickCounter(){
        const [ clickCount, setClickCount ] = React.useState(0);
        const [ autoClickState, setAutoClickState ] = React.useState(false);
        const addClickRef = React.useRef(null);
        
        function addClick(){
          setClickCount(clickCount + 1);
        }
        
        function resetClick(){
          setClickCount(0);
          setAutoClickState(false);
        }
        
        function autoClickToggle(){
          setAutoClickState(!autoClickState);
        } 
        
        React.useEffect(() => {
          let intervalId;
          if (autoClickState) {
            intervalId = setInterval(() => {addClickRef.current.click()}, 1000);
          }
          return () => {
            clearInterval(intervalId);
          }
        }, [autoClickState]);        
        
        return (
          <div
            className="buttons"
          >
            <button
              onClick={addClick}
              ref={addClickRef}
              className="button"
            >Clicked {clickCount} {clickCount === 1 ? "time" : "times"}
            </button>
            <button
              onClick={resetClick}
              className="button"
            >Reset
            </button>
            <button
              onClick={autoClickToggle}
              className="button"
            >
              Auto Click
            </button>
          </div>
        );
      }
      function App(){
        return (
        <>
          <ClickCounter/>
        </>
        );
      }   

      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container)
      root.render(<App/>);
    </script>
  </body>
</html>
